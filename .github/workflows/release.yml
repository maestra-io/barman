name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1   # ecr-public is only callable in us-east-1
  ECR_REGISTRY: public.ecr.aws/g5f9s8a4
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-barman
  AWS_ROLE_ARN: arn:aws:iam::515260921971:role/teleport-image-push

jobs:
  image:
    name: Build & push images to public ECR
    runs-on: runs-on=${{ github.run_id }}-image-${{ strategy.job-index }}/pool=build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standalone barman-cloud CLI image; reference / debug aid.
          - name: barman
            dockerfile: Dockerfile
          # Drop-in replacement for cnpg's plugin-barman-cloud-sidecar with
          # patched barman bundled in. This is the one omicron's
          # plugin-barman-cloud-config.SIDECAR_IMAGE points at.
          - name: plugin-barman-cloud-sidecar
            dockerfile: Dockerfile.sidecar
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: Public ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF

          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml || true
          test -f /tmp/tbot-output/jwt_svid

          pip install -q awscli
          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          # ecr-public API is only callable in us-east-1, even though the
          # registry itself is global. The repository is created on first run.
          aws ecr-public describe-repositories --repository-names "${{ matrix.name }}" --region "${{ env.AWS_REGION }}" 2>/dev/null || \
            aws ecr-public create-repository --repository-name "${{ matrix.name }}" --region "${{ env.AWS_REGION }}"

          PASSWORD=$(aws ecr-public get-login-password --region "${{ env.AWS_REGION }}")
          echo "$PASSWORD" | docker login public.ecr.aws --username AWS --password-stdin

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
